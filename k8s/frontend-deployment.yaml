apiVersion: v1
kind: Service
metadata:
  name: vidx-frontend
  namespace: vidx-prod
  labels:
    app: vidx-frontend
spec:
  type: ClusterIP
  selector:
    app: vidx-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidx-frontend
  namespace: vidx-prod
  labels:
    app: vidx-frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vidx-frontend
  template:
    metadata:
      labels:
        app: vidx-frontend
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - vidx-frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vidx-frontend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/vidx-frontend:latest # Update with your ECR URI
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          env:
            - name: REACT_APP_API_URL
              value: "https://api.example.com" # Update with your actual API URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-runtime
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-runtime
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vidx-frontend
  namespace: vidx-prod
