apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidx-worker
  namespace: vidx-prod
  labels:
    app: vidx-worker
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vidx-worker
  template:
    metadata:
      labels:
        app: vidx-worker
        version: v1
    spec:
      serviceAccountName: vidx-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - vidx-worker
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.35
          command:
            [
              "sh",
              "-c",
              "until nc -z mongodb.vidx-prod.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done",
            ]
      containers:
        - name: vidx-worker
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/vidx-backend:latest # Update with your ECR URI
          imagePullPolicy: Always
          command:
            - poetry
            - run
            - start-celery
          env:
            - name: QUEUE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: QUEUE_TYPE
            - name: STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: STORAGE_TYPE
            - name: VIDX_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: VIDX_DB_HOST
            - name: VIDX_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: VIDX_DB_PORT
            - name: VIDX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: VIDX_DB_USER
            - name: VIDX_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: VIDX_DB_PASS
            - name: VIDX_DB_BASE
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: VIDX_DB_BASE
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: RABBITMQ_PASS
            - name: RABBITMQ_BASE
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: RABBITMQ_BASE
            - name: FFMPEG_BINARY
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: FFMPEG_BINARY
            - name: FFPROBE_BINARY
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: FFPROBE_BINARY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: AWS_DEFAULT_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vidx-backend-secret
                  key: AWS_S3_BUCKET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: vidx-backend-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 1500m
              memory: 1.5Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: 3000m
              memory: 3Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-storage
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vidx-worker
  namespace: vidx-prod
