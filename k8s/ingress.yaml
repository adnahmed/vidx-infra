apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vidx-ingress
  namespace: vidx-prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/YOUR_CERT_ID
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Rate limiting
    alb.ingress.kubernetes.io/actions.ssl-redirect: |
      {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
spec:
  rules:
    - host: clipifie.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vidx-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vidx-frontend
                port:
                  number: 80
    - host: api.clipifie.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vidx-backend
                port:
                  number: 8000
    - host: app.clipifie.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vidx-frontend
                port:
                  number: 80
