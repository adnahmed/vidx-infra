apiVersion: v1
kind: Secret
metadata:
  name: vidx-backend-secret
  namespace: vidx-prod
type: Opaque
stringData:
  VIDX_DB_HOST: "mongodb.vidx-prod.svc.cluster.local"
  VIDX_DB_USER: "vidx"
  VIDX_DB_PASS: "vidx"
  RABBITMQ_HOST: "rabbitmq.vidx-prod.svc.cluster.local"
  RABBITMQ_USER: "vidx"
  RABBITMQ_PASS: "vidx"
  # Add AWS credentials for S3 access
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_BUCKET: "vidx-video-storage"
  # Google OAuth (update with actual values)
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  SECRET_KEY: "your-secret-key"
