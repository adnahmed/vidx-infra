server {
    listen 80;
    server_name clipifie.com www.clipifie.com;

    # Serve the React build that lives in the frontend container
    root /usr/share/nginx/html;
    index index.html;

    # Health check for the whole stack
    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Proxy API to FastAPI service inside the Docker network
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # websockets / streaming friendly defaults
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Serve static files directly
    location / {
        try_files $uri /index.html;
    }

    # (Optional) ACME HTTP-01 path if you later add certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;  # mount this if you add certbot later
    }
}
