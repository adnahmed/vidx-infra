# Render Blueprint for vidx (Social Media module deployment).
#
# Render has no managed MongoDB or RabbitMQ, so the backend web service runs
# embedded MongoDB + Redis and the Celery worker (with beat) inside the same
# container via render-entrypoint.sh. Production deployments should instead
# point VIDX_DB_* at MongoDB Atlas and REDIS_* / RABBITMQ_* at a managed
# service and disable the embedded flags.

services:
  - type: web
    name: vidx-backend
    runtime: docker
    repo: https://github.com/adnahmed/vidx
    branch: feature/social-media
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/render-entrypoint.sh
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: VIDX_ENVIRONMENT
        value: production
      - key: QUEUE_TYPE
        value: redis
      - key: VIDX_EMBEDDED_MONGO
        value: "true"
      - key: VIDX_MONGO_CACHE_GB
        value: "0.25"
      - key: VIDX_EMBEDDED_REDIS
        value: "true"
      - key: VIDX_REDIS_MAXMEMORY
        value: 96mb
      - key: VIDX_RUN_WORKER
        value: "true"
      - key: VIDX_WORKER_CONCURRENCY
        value: "1"
      - key: VIDX_AI_PROVIDER_MODE
        value: simulated
      - key: VIDX_CORS_ORIGINS
        value: https://vidx-frontend.onrender.com
      - key: VIDX_JWT_SECRET
        sync: false
      - key: VIDX_PROVIDER_WEBHOOK_SECRET
        sync: false
      - key: VIDX_SCHEDULER_TOKEN
        sync: false

  - type: web
    name: vidx-frontend
    runtime: static
    repo: https://github.com/adnahmed/vidx-app-1
    branch: feature/social-media
    buildCommand: yarn install && yarn build
    staticPublishPath: ./build
    autoDeploy: false
    envVars:
      - key: REACT_APP_API_URL
        value: https://vidx-backend.onrender.com/api
