name: Build, Push, and Deploy to EKS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile*"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com # Replace with your AWS account ID
  BACKEND_IMAGE_NAME: vidx-backend
  FRONTEND_IMAGE_NAME: vidx-frontend

jobs:
  # Code Quality Checks
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff black mypy pytest pytest-cov

      - name: Run Black (Code Formatter)
        working-directory: backend
        run: black --check vidx tests

      - name: Run Ruff (Linter)
        working-directory: backend
        run: ruff check vidx tests

      - name: Run MyPy (Type Checker)
        working-directory: backend
        run: mypy vidx

      - name: Run Tests
        working-directory: backend
        run: pytest tests --cov=vidx --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml

  # Build Backend Image
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          BRANCH=$(echo ${GITHUB_REF#refs/heads/})
          TAG=${{ github.sha }}
          if [ "$BRANCH" = "main" ]; then
            TAG="latest-${TAG:0:7}"
          else
            TAG="${BRANCH}-${TAG:0:7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: "sarif"
          output: "backend-trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "backend-trivy-results.sarif"

  # Build Frontend Image
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          BRANCH=$(echo ${GITHUB_REF#refs/heads/})
          TAG=${{ github.sha }}
          if [ "$BRANCH" = "main" ]; then
            TAG="latest-${TAG:0:7}"
          else
            TAG="${BRANCH}-${TAG:0:7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          build-args: |
            REACT_APP_API_URL=https://api.clipifie.com
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: "sarif"
          output: "frontend-trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "frontend-trivy-results.sarif"

  # Deploy to EKS
  deploy-staging:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging-app.clipifie.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name vidx-eks-cluster \
            --region ${{ env.AWS_REGION }}

      - name: Set up Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to EKS (Staging)
        env:
          BACKEND_IMAGE_URI: ${{ needs.build-backend.outputs.image-uri }}
          FRONTEND_IMAGE_URI: ${{ needs.build-frontend.outputs.image-uri }}
          ENVIRONMENT: staging
        run: |
          # Update backend image
          kubectl set image deployment/vidx-backend \
            vidx-backend=${BACKEND_IMAGE_URI} \
            -n vidx-prod \
            --record

          # Update frontend image
          kubectl set image deployment/vidx-frontend \
            vidx-frontend=${FRONTEND_IMAGE_URI} \
            -n vidx-prod \
            --record

          # Wait for rollout
          kubectl rollout status deployment/vidx-backend -n vidx-prod --timeout=5m
          kubectl rollout status deployment/vidx-frontend -n vidx-prod --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get deployments -n vidx-prod
          kubectl get pods -n vidx-prod
          kubectl get svc -n vidx-prod

      - name: Check Application Health
        run: |
          # Get the load balancer endpoint
          ENDPOINT=$(kubectl get ingress vidx-ingress -n vidx-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Application endpoint: $ENDPOINT"

          # Wait for endpoint to be ready
          for i in {1..30}; do
            if curl -s -f "http://$ENDPOINT/api/health" > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application to be healthy... ($i/30)"
            sleep 10
          done

          echo "Application health check failed"
          exit 1

      - name: Create Deployment Notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployment to staging complete!\n\nImages:\n- Backend: ${{ needs.build-backend.outputs.image-uri }}\n- Frontend: ${{ needs.build-frontend.outputs.image-uri }}'
            })

  deploy-production:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://clipifie.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name vidx-eks-cluster \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS (Production)
        env:
          BACKEND_IMAGE_URI: ${{ needs.build-backend.outputs.image-uri }}
          FRONTEND_IMAGE_URI: ${{ needs.build-frontend.outputs.image-uri }}
          ENVIRONMENT: production
        run: |
          # Update backend image with rolling update strategy
          kubectl set image deployment/vidx-backend \
            vidx-backend=${BACKEND_IMAGE_URI} \
            -n vidx-prod \
            --record

          # Update frontend image with rolling update strategy
          kubectl set image deployment/vidx-frontend \
            vidx-frontend=${FRONTEND_IMAGE_URI} \
            -n vidx-prod \
            --record

          # Update worker image
          kubectl set image deployment/vidx-worker \
            vidx-worker=${BACKEND_IMAGE_URI} \
            -n vidx-prod \
            --record

          # Wait for rollout
          kubectl rollout status deployment/vidx-backend -n vidx-prod --timeout=10m
          kubectl rollout status deployment/vidx-frontend -n vidx-prod --timeout=10m
          kubectl rollout status deployment/vidx-worker -n vidx-prod --timeout=10m

      - name: Verify Production Deployment
        run: |
          kubectl get deployments -n vidx-prod
          kubectl get pods -n vidx-prod
          kubectl get svc -n vidx-prod
          kubectl get hpa -n vidx-prod

      - name: Check Application Health
        run: |
          # Get the load balancer endpoint
          ENDPOINT=$(kubectl get ingress vidx-ingress -n vidx-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Application endpoint: $ENDPOINT"

          # Wait for endpoint to be ready
          for i in {1..40}; do
            if curl -s -f "http://$ENDPOINT/api/health" > /dev/null; then
              echo "Application is healthy in production"
              exit 0
            fi
            echo "Waiting for application to be healthy... ($i/40)"
            sleep 15
          done

          echo "Application health check failed"
          exit 1

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          kubectl rollout undo deployment/vidx-backend -n vidx-prod
          kubectl rollout undo deployment/vidx-frontend -n vidx-prod
          kubectl rollout undo deployment/vidx-worker -n vidx-prod
          kubectl rollout status deployment/vidx-backend -n vidx-prod --timeout=5m

      - name: Create Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.sha }}
          release_name: Production Release - ${{ github.sha }}
          body: |
            ## Production Deployment
            - **Backend Image**: ${{ needs.build-backend.outputs.image-uri }}
            - **Frontend Image**: ${{ needs.build-frontend.outputs.image-uri }}
            - **Timestamp**: ${{ github.event.head_commit.timestamp }}
            - **Author**: ${{ github.event.head_commit.author.name }}
          draft: false
          prerelease: false

  # Notifications
  notify:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()
    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "VIDX Deployment Status",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*VIDX CI/CD Pipeline*\n*Branch*: ${{ github.ref }}\n*Commit*: ${{ github.sha }}\n*Author*: ${{ github.actor }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Backend Status*\n${{ job.status }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Frontend Status*\n${{ job.status }}"
                    }
                  ]
                }
              ]
            }
        if: always()
